<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bad Bunny — Estoy en mi Peke</title>

  <style>
    /* ==== ESTILO GENERAL ==== */
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at center, #0e1226, #05060b 80%);
      overflow: hidden;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* ==== ANIMACIÓN DE FONDO ==== */
    .bg {
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,0,150,0.3), rgba(0,150,255,0.15), transparent);
      animation: spin 15s infinite linear;
      filter: blur(80px);
      z-index: -1;
    }

    @keyframes spin {
      0% { transform: rotate(0deg) scale(1.1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1.1); }
    }

    /* ==== TARJETA CENTRAL ==== */
    .card {
      width: min(900px, 95%);
      padding: 24px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      animation: appear 1s ease forwards;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0 0 20px;
      font-size: 2rem;
      text-shadow: 0 0 10px #ff005e;
      animation: glowText 3s infinite ease-in-out;
    }

    @keyframes glowText {
      0%, 100% { text-shadow: 0 0 8px #ff005e; }
      50% { text-shadow: 0 0 18px #ff4fa6; }
    }

    /* ==== CONTENEDOR DE VIDEO ==== */
    .iframe-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(255,0,150,0.3);
    }

    .iframe-wrap iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ==== BOTONES ==== */
    .btn {
      margin-top: 20px;
      display: inline-block;
      background: linear-gradient(90deg, #ff005e, #ff4fa6);
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 18px #ff4fa6;
    }

    .credit {
      margin-top: 12px;
      font-size: .8rem;
      opacity: .7;
    }

  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="card">
    <h1>Estoy en mi Peke — Bad Bunny</h1>

    <div class="iframe-wrap">
      <iframe id="ytplayer"
              src="https://www.youtube.com/embed/NUteQQCMa_k?rel=0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
      </iframe>
    </div>

    <a class="btn" href="https://www.youtube.com/watch?v=NUteQQCMa_k" target="_blank">Abrir en YouTube</a>

    <p class="credit">Reproducción vía YouTube — © derechos de los artistas.</p>
  </div>

</body>
</html>
