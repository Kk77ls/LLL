<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bad Bunny — Estoy en mi Peke</title>

<style>
/* ------------------
   FONDO ANIMADO
---------------------*/
body {
  margin: 0;
  overflow: hidden;
  background: #05060f;
  font-family: 'Inter', sans-serif;
  color: #fff;
}

/* Partículas */
canvas#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: -2;
}

/* Brillo radial */
.bg-glow {
  position: fixed;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background: radial-gradient(circle, rgba(255,0,160,0.25), rgba(0,120,255,0.2), transparent 70%);
  filter: blur(80px);
  animation: glowSpin 18s infinite linear;
  z-index: -1;
}

@keyframes glowSpin {
  0% { transform: rotate(0deg) scale(1.1); }
  50% { transform: rotate(180deg) scale(1.25); }
  100% { transform: rotate(360deg) scale(1.1); }
}

/* ------------------
   TARJETA CENTRAL
---------------------*/
.container {
  position: relative;
  max-width: 900px;
  margin: 80px auto;
  padding: 30px;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  box-shadow: 0 0 35px rgba(255,0,150,0.4);
  text-align: center;
  animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Título animado */
h1 {
  font-size: 2.5rem;
  margin-bottom: 15px;
  animation: neon 3s infinite ease-in-out;
}

@keyframes neon {
  0%,100% { text-shadow: 0 0 12px #ff0088; }
  50%     { text-shadow: 0 0 28px #ff44cc; }
}

/* ------------------
   REPRODUCTOR YOUTUBE
---------------------*/
.video-box {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(255,0,150,0.3);
}

.video-box iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  border: 0;
}

/* Botones */
.btn {
  margin-top: 20px;
  padding: 12px 22px;
  font-size: 1.1rem;
  background: linear-gradient(90deg,#ff0088,#ff44cc);
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  transition: 0.25s;
  text-decoration: none;
  display: inline-block;
}

.btn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 18px #ff44cc;
}

/* ------------------
   VISUALIZADOR AUDIO
---------------------*/
#visualizer {
  width: 100%;
  height: 160px;
  background: #070712;
  border-radius: 12px;
  margin-top: 25px;
  box-shadow: 0 0 20px rgba(0,200,255,0.3);
}
</style>
</head>

<body>

<canvas id="particles"></canvas>
<div class="bg-glow"></div>

<div class="container">
  <h1>Estoy en mi Peke — Bad Bunny</h1>

  <div class="video-box">
    <iframe id="ytplayer"
      src="https://www.youtube.com/embed/NUteQQCMa_k?enablejsapi=1"
      allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <a class="btn" href="https://www.youtube.com/watch?v=NUteQQCMa_k" target="_blank">
    Ver en YouTube
  </a>

  <canvas id="visualizer"></canvas>
</div>

<script>
/* --------------------------
   SISTEMA DE PARTÍCULAS
----------------------------*/
const c = document.getElementById("particles");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

let particles = [];

for (let i=0; i<80; i++) {
  particles.push({
    x: Math.random()*c.width,
    y: Math.random()*c.height,
    s: Math.random()*2 + 1,
    vx: (Math.random()-.5)*0.6,
    vy: (Math.random()-.5)*0.6
  });
}

function drawParticles(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
    ctx.fill();
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.x<0||p.x>c.width) p.vx*=-1;
    if(p.y<0||p.y>c.height) p.vy*=-1;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

/* --------------------------
   VISUALIZADOR DE AUDIO
----------------------------*/
const vis = document.getElementById("visualizer");
const vctx = vis.getContext("2d");

vis.width = vis.clientWidth;
vis.height = vis.clientHeight;

// Analizador falso animado (porque el audio es de YouTube)
function visualizeFake(){
  vctx.clearRect(0,0,vis.width,vis.height);

  for(let i=0;i<60;i++){
    let h = Math.random()*vis.height*0.9;
    let x = i*(vis.width/60);
    let barWidth = (vis.width/60)-2;
    vctx.fillStyle = `rgba(${200+h/8}, ${40+h/4}, ${255-h/5}, 1)`;
    vctx.fillRect(x, vis.height-h, barWidth, h);
  }
  requestAnimationFrame(visualizeFake);
}
visualizeFake();
</script>

</body>
</html>
